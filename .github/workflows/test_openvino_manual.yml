name: OpenVINO - Run Specific Test

on:
  workflow_dispatch:
    inputs:
      test-file:
        description: "Test file under tests/openvino (e.g. test_exporters_cli.py)"
        required: true
        type: string
      pytest-args:
        description: "Additional pytest arguments (e.g. -k llava)"
        required: false
        type: string
        default: ""
      transformers-version:
        description: "Transformers version (e.g. 4.57.6 or latest)"
        required: true
        type: string
        default: latest
  # Lets reviewers see this workflow run in a PR that changes it (a workflow_dispatch workflow can only be started
  # manually once it exists on the default branch). A small smoke test is used, since there are no inputs.
  pull_request:
    paths:
      - .github/workflows/test_openvino_manual.yml

permissions: {}

env:
  UV_TORCH_BACKEND: cpu
  UV_SYSTEM_PYTHON: true
  TRANSFORMERS_IS_CI: true
  HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
  # Inputs are only set for manual runs. For pull_request runs a small smoke test is used.
  # Note: inputs are not validated (except that test-file must be an existing test file). Manual runs can only be
  # started by users with write access, and the values are only passed through the environment, never into scripts.
  TEST_FILE: ${{ inputs.test-file || 'test_transformations.py' }}
  PYTEST_ARGS: ${{ inputs.pytest-args || '' }}
  TRANSFORMERS_VERSION: ${{ inputs.transformers-version || 'latest' }}

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip uv
          uv pip install .[tests,diffusers] librosa

      - name: Restore HF models cache
        if: env.HF_TOKEN == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models

      - name: Login with fork PRs CI token
        if: env.HF_TOKEN == ''
        run: python tests/scripts/login_with_ci_token.py

      - if: ${{ env.TRANSFORMERS_VERSION != 'latest' }}
        name: Install transformers
        run: |
          # Include datasets so it is re-resolved against the huggingface-hub version of the selected transformers
          uv pip install "transformers==$TRANSFORMERS_VERSION" datasets

      - if: ${{ env.TRANSFORMERS_VERSION == '4.57.6' }}
        name: Pin diffusers (diffusers>=0.40 requires huggingface-hub>=1.23, incompatible with transformers==4.57.6's huggingface-hub<1.0)
        run: |
          uv pip install "diffusers<0.40"

      - if: ${{ env.TRANSFORMERS_VERSION == '4.57.6' }}
        name: Install qwen-asr package
        run: |
          uv pip install qwen-asr

      - if: ${{ env.TRANSFORMERS_VERSION == '4.57.6' }}
        name: Pin sentencepiece (0.2.2 fails to load some legacy remote-code tokenizer.model files)
        run: |
          uv pip install "sentencepiece<0.2.2"

      - if: ${{ env.TEST_FILE == 'test_decoder.py' }}
        name: Install auto-gptq, autoawq
        run: |
          uv pip install auto-gptq "autoawq<0.2.8"

      - name: Show CPU info
        run: |
          lscpu | grep 'Model name'
          echo 'CPU flags of interest:'
          grep -o -E 'avx512f|avx512_bf16|amx_bf16|amx_tile' /proc/cpuinfo | sort -u

      - name: Test with Pytest
        shell: python
        run: |
          import os
          import shlex
          import subprocess
          import sys
          from pathlib import Path

          test_file = os.environ["TEST_FILE"]
          test_path = Path("tests/openvino") / test_file
          if Path(test_file).name != test_file or not test_path.is_file() or test_path.suffix != ".py":
              sys.exit("Select an existing Python test filename under tests/openvino.")
          command = [sys.executable, "-m", "pytest", str(test_path), *shlex.split(os.environ["PYTEST_ARGS"]), "-rpfs"]
          print(shlex.join(command), flush=True)
          sys.exit(subprocess.call(command))
