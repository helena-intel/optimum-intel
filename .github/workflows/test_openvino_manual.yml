name: OpenVINO - Run Specific Test

on:
  workflow_dispatch:
    inputs:
      test-file:
        description: "Test file under tests/openvino (e.g. test_exporters_cli.py)"
        required: true
        type: string
        default: test_exporters_cli.py
      pytest-args:
        description: "Additional pytest arguments (e.g. -k llava)"
        required: false
        type: string
        default: ""
      transformers-version:
        description: "Transformers version (e.g. 4.57.6 or latest)"
        required: true
        type: string
        default: latest

permissions: {}

env:
  UV_TORCH_BACKEND: cpu
  UV_SYSTEM_PYTHON: true
  TRANSFORMERS_IS_CI: true
  PYTHONFAULTHANDLER: "1"
  HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip uv
          uv pip install .[tests,diffusers] librosa

      - name: Restore HF models cache
        id: hf-cache-restore
        if: env.HF_TOKEN == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models

      - if: ${{ inputs.transformers-version != 'latest' }}
        name: Install transformers
        env:
          TRANSFORMERS_VERSION: ${{ inputs.transformers-version }}
        run: |
          uv pip install "transformers==$TRANSFORMERS_VERSION"

      - if: ${{ inputs.transformers-version == '4.57.6' }}
        name: Pin diffusers (diffusers>=0.40 requires huggingface-hub>=1.23, incompatible with transformers==4.57.6's huggingface-hub<1.0)
        run: |
          uv pip install "diffusers<0.40"

      - if: ${{ inputs.transformers-version == '4.57.6' }}
        name: Install qwen-asr package
        run: |
          uv pip install qwen-asr

      - if: ${{ inputs.transformers-version == '4.57.6' }}
        name: Pin sentencepiece (0.2.2 fails to load some legacy remote-code tokenizer.model files)
        run: |
          uv pip install "sentencepiece<0.2.2"

      - if: ${{ contains(inputs.test-file, 'decoder') }}
        name: Install auto-gptq, autoawq
        run: |
          uv pip install auto-gptq "autoawq<0.2.8"

      - name: Login with fork PRs CI token
        if: env.HF_TOKEN == ''
        run: python tests/scripts/login_with_ci_token.py

      - name: Report diagnostic environment
        run: |
          uname -a
          lscpu
          nproc
          free -h
          df -h / /dev/shm
          python -VV
          uv pip freeze

      - name: Check dependency consistency
        continue-on-error: true
        run: uv pip check

      - name: Install native debugger
        id: native_debugger
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdb

      - name: Test with Pytest
        timeout-minutes: 15
        env:
          TEST_FILE: ${{ inputs.test-file }}
          PYTEST_ARGS: ${{ inputs.pytest-args }}
          OV_CLI_DIAGNOSTICS_TIMEOUT: "300"
        shell: python
        run: |
          import os
          import shlex
          import subprocess
          import sys
          from pathlib import Path

          test_file = os.environ["TEST_FILE"]
          test_path = Path("tests/openvino") / test_file
          if Path(test_file).name != test_file or not test_path.is_file() or test_path.suffix != ".py":
              sys.exit("Select an existing Python test filename under tests/openvino.")
          command = [sys.executable, "-m", "pytest", str(test_path), *shlex.split(os.environ["PYTEST_ARGS"]), "-vv", "-rpfs"]
          print(shlex.join(command), flush=True)
          sys.exit(subprocess.call(command))

      - name: Probe dataset-only streaming shutdown
        if: ${{ !cancelled() && steps.native_debugger.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 7
        run: python tests/scripts/diagnose_subprocess.py --timeout 300 --probe-textvqa
